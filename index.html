<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фруктовый разрез</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe6;--dim:#9fb5ba;--hot:#ff5a4d;--btn:#ffd23f;--btnink:#2a1d00;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{overscroll-behavior:none;background:#06161c;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 120%,#1d5560 0%,#10303a 45%,#06161c 100%);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);padding:0 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#score{font-size:56px;font-weight:800;line-height:1}
#best{font-size:14px;color:var(--dim);margin-top:4px}
#lives{font-size:30px;letter-spacing:4px;color:var(--hot)}
#lives .off{color:#ffffff30}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#06161ccc;gap:14px}
#ov.hide{display:none}
h1{margin:0;font-size:clamp(34px,9vw,60px);font-weight:800;line-height:1.05}
#ov p{margin:0;max-width:30ch;font-size:17px;line-height:1.45;color:var(--dim)}
button{font:inherit;font-weight:800;font-size:20px;background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:14px 40px;cursor:pointer;margin-top:6px}
#mute{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);padding:6px 12px;font-size:20px;margin:0;background:#ffffff22;color:var(--ink);z-index:2}
.sec{background:#ffffff26;color:var(--ink);font-size:17px;padding:10px 28px;margin:0}
#coins{font-size:18px;color:var(--btn);font-weight:800}
#shop{position:fixed;inset:0;z-index:3;background:#06161cf5;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);gap:12px}
#shop.hide{display:none}
.sh{display:flex;justify-content:space-between;align-items:center}.sh h2{margin:0;font-size:28px}#sc{font-size:20px;font-weight:800;color:var(--btn)}
#tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-size:15px;padding:8px 16px;margin:0;background:#ffffff1c;color:var(--ink)}.tab.on{background:var(--btn);color:var(--btnink)}
#list{flex:1;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px}
.it{display:flex;align-items:center;gap:12px;background:#ffffff12;border-radius:16px;padding:12px}
.nm{flex:1;font-weight:500;font-size:17px;display:flex;flex-direction:column}.nm small{color:var(--dim);font-size:13px;margin-top:2px}
.it button{font-size:15px;padding:9px 16px;margin:0;white-space:nowrap}.it button:disabled{opacity:.45;cursor:default}
#pw{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid #ffffff44;background:#ffffff1c;color:var(--ink);-webkit-user-select:text;user-select:text;outline:none}#pw:focus{border-color:var(--btn)}#pwm{color:var(--hot);min-height:1.2em}
#scr{position:fixed;inset:0;z-index:5;background:#000;display:none;pointer-events:none}#scr.on{display:block;animation:pop .22s ease-out}#scr img{width:100%;height:100%;object-fit:cover;display:block}@keyframes pop{from{transform:scale(1.5)}to{transform:scale(1)}}@media (prefers-reduced-motion:reduce){#scr.on{animation:none}}
#mei{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:1;display:none;pointer-events:none;width:96px}
#mei img{width:100%;display:block;border-radius:18px;border:3px solid #f4efe6cc}
#mb{position:absolute;right:0;bottom:calc(100% + 12px);background:#f4efe6;color:#1b2a2e;padding:8px 12px;border-radius:14px;font-size:14px;font-weight:500;width:max-content;max-width:190px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
#mb.on{opacity:1;transform:none}
#mb::after{content:"";position:absolute;right:30px;top:100%;border:8px solid transparent;border-top-color:#f4efe6}
.sw{width:38px;height:38px;border-radius:10px;flex:none;border:2px solid #ffffff55}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>

let SP,CH,MEL,T;
function setTrack(i){T=TR[i]||TR[0];SP=60/T.bpm/2;CH=T.ch;MEL=T.mel;mstep=0}
const mf=n=>440*Math.pow(2,(n-69)/12);
function note(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.16)}
function hat(t){const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NB;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+.06)}
function sched(){
  while(mt<AC.currentTime+.4){
    const i=mstep&7,ch=CH[(mstep>>3)&3],m=MEL[mstep%32];
    note(mf(ch[i%3]+12),mt,SP*.9,T.a,.04);
    if(i%2===0)note(mf(ch[0]-12),mt,SP*1.7,'triangle',.22);
    if(m)note(mf(m),mt,SP*1.8,T.w,.05);
    if(i%4===0&&T.k)kick(mt);
    if(i%2===1)hat(mt);
    mt+=SP;mstep++;
  }
}

  if(SFX||!AC)return;
  try{const bin=atob(SFXB64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    AC.decodeAudioData(u.buffer,buf=>{SFX=buf},()=>{});}catch(e){}
}

}

function tint(i){const c=document.createElement('canvas');c.width=IMG.naturalWidth;c.height=IMG.naturalHeight;const x=c.getContext('2d');x.drawImage(IMG,0,0);
  const d=x.getImageData(0,0,c.width,c.height),a=d.data,dh=SK[i].h-50;
  for(let p=0;p<a.length;p+=4){const r=a[p]/255,g=a[p+1]/255,b=a[p+2]/255,mx=Math.max(r,g,b),df=mx-Math.min(r,g,b);if(df<.08)continue;
    let h=mx===r?((g-b)/df)%6:mx===g?(b-r)/df+2:(r-g)/df+4;h=((h*60+dh)%360+360)%360;
    const cc=mx*(df/mx),xx=cc*(1-Math.abs((h/60)%2-1)),m=mx-cc;
    const [R,G,B]=[[cc,xx,0],[xx,cc,0],[0,cc,xx],[0,xx,cc],[xx,0,cc],[cc,0,xx]][h/60|0];
    a[p]=(R+m)*255;a[p+1]=(G+m)*255;a[p+2]=(B+m)*255}
  x.putImageData(d,0,0);return c}

  if(b.life>0){b.life--;maxL=4}if(b.slow>0){b.slow--;slowF=.75}if(b.dbl>0){b.dbl--;mult=2}if(SV.cht.x10)mult*=10;if(SV.cht.slow)slowF=Math.min(slowF,.5);save()}
function refreshCoins(){$('coins').textContent='🪙 '+SV.coins}
function applySel(k){if(k==='bg')document.body.style.background=CAT.bg[SV.sel.bg].css;if(k==='mu')setTrack(SV.sel.mu)}
function render(){
  $('sc').textContent='🪙 '+SV.coins;
  $('tabs').innerHTML=TABS.map(([k,l])=>'<button class="tab'+(k===tab?' on':'')+'" data-t="'+k+'">'+l+'</button>').join('');
  if(tab==='ch'&&!chOK){$('list').innerHTML='<input id="pw" type="password" placeholder="Пароль" autocomplete="off"><button data-pw="1">Войти</button><small id="pwm"></small>';return}
  if(tab==='fs'){
    let h='<div class="it"><div class="nm">📦 Ящик со скином<small>Случайный цвет фруктов. Повтор вернёт 300 🪙</small>'+(crMsg?'<small style="color:var(--btn)">'+crMsg+'</small>':'')+'</div><button data-crate="1"'+(SV.coins<900?' disabled':'')+'>900 🪙</button></div>';
    h+=SK.map((k,i)=>{const own=SV.own.fs.includes(i),sel=SV.sel.fs===i;
      return '<div class="it"><i class="sw" style="background:'+(own?k.css:'#333')+'"></i><div class="nm">'+(own?k.n:'???')+'</div>'+(sel?'<button disabled>Выбрано</button>':own?'<button data-b="'+i+'">Выбрать</button>':'<button disabled>🔒</button>')+'</div>'}).join('');
    $('list').innerHTML=h;return}
  $('list').innerHTML=CAT[tab].map((it,i)=>{
    let btn,sub='';
    if(tab==='ch'||tab==='fn'){const on=(tab==='ch'?SV.cht:SV.fun)[it.k];btn='<button data-b="'+i+'">'+(it.act?'Получить':on?'Вкл ✓':'Выкл')+'</button>';sub=it.d?'<small>'+it.d+'</small>':''}else if(tab==='bf'){btn='<button data-b="'+i+'"'+(SV.coins<it.p?' disabled':'')+'>'+it.p+' 🪙</button>';sub='<small>'+it.d+'. В запасе: '+SV.buffs[it.k]+'</small>'}
    else{const own=SV.own[tab].includes(i),sel=SV.sel[tab]===i;
      btn=sel?'<button disabled>Выбрано</button>':own?'<button data-b="'+i+'">Выбрать</button>':'<button data-b="'+i+'"'+(SV.coins<it.p?' disabled':'')+'>'+it.p+' 🪙</button>'}
    const sw=it.c?'<i class="sw" style="background:'+it.c+'"></i>':'';
    return '<div class="it">'+sw+'<div class="nm">'+it.n+sub+'</div>'+btn+'</div>'}).join('');
}
const PWH='0YLQvtC70LrQsNC50L4=';
function checkPw(){const v=$('pw').value.trim().toLowerCase();
  if(btoa(unescape(encodeURIComponent(v)))===PWH){chOK=true;render()}else{$('pwm').textContent='Неверный пароль';$('pw').value=''}}
$('shop').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')checkPw()});
function buy(i){const it=CAT[tab][i];
  if(tab==='fn'){SV.fun[it.k]=!SV.fun[it.k];applyFun()}else if(tab==='ch'){if(it.k==='coins')SV.coins+=1000;else if(it.k==='all'){for(const k of ['bg','mu','tr','fs'])SV.own[k]=CAT[k].map((_,j)=>j)}else SV.cht[it.k]=!SV.cht[it.k]}else if(tab==='bf'){if(SV.coins<it.p)return;SV.coins-=it.p;SV.buffs[it.k]++}
  else{if(!SV.own[tab].includes(i)){if(SV.coins<it.p)return;SV.coins-=it.p;SV.own[tab].push(i)}SV.sel[tab]=i;applySel(tab)}
  save();render();refreshCoins()}
$('shop').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.crate)openCrate();else if(t.dataset.pw)checkPw();else if(t.dataset.t){if(t.dataset.t!=='ch')chOK=false;tab=t.dataset.t;render()}else if(t.dataset.b!==undefined)buy(+t.dataset.b)});
$('shopb').addEventListener('click',()=>{$('shop').classList.remove('hide');render()});
$('back').addEventListener('click',()=>{chOK=false;$('shop').classList.add('hide');refreshCoins()});
applySel('bg');setTrack(SV.sel.mu);refreshCoins();
let scrT=15;
function screamSnd(){if(!AC||muted)return;try{const t=AC.currentTime;for(const f of [660,990,1320]){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.7);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.8);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.85)}}catch(e){}}
function scream(){const el=$('scr');el.classList.remove('on');void el.offsetWidth;el.classList.add('on');screamSnd();setTimeout(()=>el.classList.remove('on'),900)}
function scrTick(dt){if(st==='play'&&SV.fun.scr){scrT-=dt;if(scrT<=0){scream();scrT=10+Math.random()*25}}}
const MQ=['Ты уже поел?','А воды ты выпил?','Почему ты не режешь арбуз?','Сколько у тебя осталось жизней?','Это точно фрукт?','Тебе не страшно?','Ты кто такой?','Можно мне кусочек?','Ты любишь котиков?','Почему тот зелёный монстр спит?','Ты устал? Может, отдохнёшь?','А где мой сладкий перчик?','Ты правда умеешь так быстро резать?','Который сейчас час?','Тебе нравится эта музыка?','А ты не забыл поздороваться с котиком?'];
let meiLast=-1;
function applyFun(){$('mei').style.display=SV.fun.mei?'block':'none';if(!SV.fun.mei)$('mb').classList.remove('on')}
function meiLoop(){
  if(SV.fun.mei){let i;do{i=Math.random()*MQ.length|0}while(i===meiLast);meiLast=i;
    $('mb').textContent=MQ[i];$('mb').classList.add('on');setTimeout(()=>$('mb').classList.remove('on'),4500)}
  setTimeout(meiLoop,7000+Math.random()*6000)}
applyFun();setTimeout(meiLoop,2500);
function hud(){
  $('score').textContent=score;
  $('best').textContent='Рекорд: '+best;
  $('lives').innerHTML=Array.from({length:maxL},(_,i)=>i).map(i=>'<span class="'+(i<lives?'':'off')+'">♥</span>').join('');
}
function spawn(){
  const R=Math.max(30,Math.min(W,H)*.08),G=H*1.5;
  const bomb=Math.random()<Math.min(.08+score/1500,.2);
  const f=FR[Math.random()*FR.length|0];
  const x=W*(.12+Math.random()*.76);
  const peak=H*(.5+Math.random()*.3);
  const vy=-Math.sqrt(2*G*peak);
  const vx=(W/2-x)*(.25+Math.random()*.5)/(-vy/G);
  items.push({x,y:H+R,vx,vy,r:R,bomb,e:bomb?'💣':f[0],c:bomb?f[1]:SK[SV.sel.fs|0].css,a:0,va:(Math.random()-.5)*6,done:false});
}
function splash(x,y,c,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=80+Math.random()*260;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.7+Math.random()*.5,c,s:2+Math.random()*4})}
}
function slice(it,dx,dy){
  it.done=true;
  if(it.bomb){if(SV.cht.safe){splash(it.x,it.y,'#7bd88f',20);return}flash=1;splash(it.x,it.y,'#ffb020',40);if(!SV.cht.god)lives--;hud();if(lives<=0)finish();return}
  swipeN++;score+=mult;playSlice();
  let txt='+'+mult;
  if(swipeN>=3){score+=swipeN*mult;txt='Комбо ×'+swipeN}
  floats.push({x:it.x,y:it.y,t:0,txt});
  const ang=Math.atan2(dy,dx);
  [-1,1].forEach(side=>halves.push({e:it.e,r:it.r,x:it.x,y:it.y,
    vx:it.vx+side*Math.cos(ang+1.57)*140,vy:it.vy+side*Math.sin(ang+1.57)*140-40,a:it.a,va:it.va+side*3,side}));
  splash(it.x,it.y,it.c,18);
  if(score>best&&!(SV.cht.god||SV.cht.safe||SV.cht.auto||SV.cht.x10||SV.cht.slow))best=score;
  hud();
}
function finish(){
  if(st!=='play')return;
  st='over';SV.coins+=score;save();
  try{localStorage.setItem('slice-best',best)}catch(e){}
  hud();
  setTimeout(()=>{
    refreshCoins();$('t').textContent='Счёт: '+score+' (+'+score+' 🪙)';
    $('d').textContent=score>=best&&score>0?'Новый рекорд! Сможете лучше?':'Рекорд: '+best+'. Сыграем ещё раз?';
    $('go').textContent='Играть снова';
    $('ov').classList.remove('hide');
  },700);
}
function start(){
  music();scrT=6+Math.random()*14;applyBuffs();score=0;lives=maxL;items=[];halves=[];parts=[];floats=[];trail=[];swipeN=0;spawnT=0;st='play';
  $('ov').classList.add('hide');hud();
}
$('go').addEventListener('click',start);

function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;
  let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
cv.addEventListener('pointerdown',e=>{down=true;swipeN=0;last={x:e.clientX,y:e.clientY};trail.push({x:e.clientX,y:e.clientY,t:performance.now()});cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
  if(!down)return;
  const p={x:e.clientX,y:e.clientY};
  trail.push({x:p.x,y:p.y,t:performance.now()});
  if(st==='play'&&last&&Math.hypot(p.x-last.x,p.y-last.y)>3){
    for(const it of items){
      if(!it.done&&segDist(it.x,it.y,last.x,last.y,p.x,p.y)<it.r*.9)slice(it,p.x-last.x,p.y-last.y);
    }
  }
  last=p;
});
const up=()=>{down=false;last=null;swipeN=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function update(dt){
  const G=H*1.5;
  if(st==='play'){
    spawnT-=dt;
    if(spawnT<=0){
      spawnT=Math.max(.55,1.2-score/120);
      const n=1+(Math.random()*(1+score/40)|0);
      for(let i=0;i<Math.min(n,4);i++)spawn();
    }
  }
  for(const it of items){it.vy+=G*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.a+=it.va*dt;
    if(!it.done&&it.vy>0&&it.y>H+it.r*1.5){
      it.done=true;
      if(!it.bomb&&st==='play'){if(!SV.cht.god)lives--;hud();if(lives<=0)finish()}
    }}
  if(SV.cht.auto&&st==='play'){swipeN=0;for(const it of items)if(!it.done&&!it.bomb&&it.vy>0&&it.y<H*.75)slice(it,1,0)}
  items=items.filter(it=>!it.done||it.y<=H+it.r*1.5&&false);
  for(const h of halves){h.vy+=G*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.a+=h.va*dt}
  halves=halves.filter(h=>h.y<H+h.r*2);
  for(const p of parts){p.vy+=G*.6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.t+=dt;f.y-=40*dt}
  floats=floats.filter(f=>f.t<.9);
  flash=Math.max(0,flash-dt*2);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
  for(const it of items){
    ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.a);
    if(it.bomb){const w=it.r*2.2;ctx.drawImage(BIMG,-w/2,-w*BAR/2,w,w*BAR)}else{const w=it.r*2.1;ctx.drawImage(FI(),-w/2,-w*AR/2,w,w*AR)}ctx.restore();
  }
  for(const h of halves){
    ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.a);
    ctx.beginPath();ctx.rect(h.side<0?-h.r*1.3:0,-h.r*1.3,h.r*1.3,h.r*2.6);ctx.clip();
    {const w=h.r*2.1;ctx.drawImage(FI(),-w/2,-w*AR/2,w,w*AR)}ctx.restore();
  }
  ctx.font='800 22px Rubik,system-ui,sans-serif';
  for(const f of floats){ctx.globalAlpha=1-f.t/.9;ctx.fillStyle='#f4efe6';ctx.fillText(f.txt,f.x,f.y-30)}
  ctx.globalAlpha=1;
  const now=performance.now();
  trail=trail.filter(p=>now-p.t<200);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#bfefff';ctx.shadowBlur=14;
  for(let i=1;i<trail.length;i++){
    const k=1-(now-trail[i].t)/200;
    ctx.globalAlpha=k;ctx.strokeStyle=trailColor();ctx.lineWidth=1+7*k;
    ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*.8+')';ctx.fillRect(0,0,W,H)}
}
function loop(t){
  const dt=Math.min(.033,(t-prev)/1000||0);prev=t;
  scrTick(dt);update(dt*slowF);draw();requestAnimationFrame(loop);
}
hud();requestAnimationFrame(loop);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
